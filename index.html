<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forum machina</title>
    <style>
        :root { color-scheme: light; }
        body {
            margin: 0;
            background: #ffffff;
            color: #212529;
            font-family: "Segoe UI", Meiryo, sans-serif;
            line-height: 1.7;
        }
        header {
            background: #212529;
            color: #ffffff;
            padding: 28px 24px 22px;
        }
        header h1 {
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 0.04em;
        }
        header h1 .accent { color: #2f9e44; }
        header p {
            margin: 8px 0 0;
            color: #adb5bd;
            font-size: 0.9rem;
        }
        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 28px 24px 60px;
        }
        h2 {
            font-size: 1.1rem;
            border-left: 6px solid #2f9e44;
            padding-left: 10px;
            margin: 30px 0 12px;
        }
        ul.pub-list { padding-left: 22px; }
        ul.pub-list li { margin: 6px 0; }
        .empty {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 14px 16px;
            color: #6c757d;
            font-size: 0.92rem;
        }
        footer {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 24px 40px;
            color: #6c757d;
            font-size: 0.8rem;
            border-top: 1px solid #dee2e6;
            padding-top: 14px;
        }
        a { color: #1c7ed6; }
    </style>
</head>
<body>
    <header>
        <h1>forum <span class="accent">machina</span></h1>
        <p>実験結果と論考の公開アーカイブ</p>
    </header>
    <main>
        <h2>公開物</h2>
        <div class="empty">準備中。実験結果・論考を順次ここに掲載する。</div>
    </main>
    <footer>
        forum-machina
    </footer>
</body>
</html>
